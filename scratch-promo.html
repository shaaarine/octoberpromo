<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Nails by Sha — October Surprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#EAE3DA;
    --wine:#7B2D3E;
    --gold:#C6A15B;
    --sage:#8B9A7C;
    --brown:#6B4A3B;
    --pink:#E7B8BE;
    --paper:#F4EFE7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(199,161,91,0.18), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(123,45,62,0.10), transparent 45%);
    font-family:'Public Sans', sans-serif;
    color:var(--wine);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 18px 56px;
  }
  .wrap{
    width:100%;
    max-width:520px;
  }
  .masthead{
    text-align:center;
    margin-bottom:30px;
  }
  .eyebrow-icon{
    width:30px;height:30px;margin:0 auto 14px;
    opacity:.75;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(26px, 6vw, 34px);
    line-height:1.15;
    margin:0 0 10px;
    letter-spacing:-0.01em;
  }
  .sub{
    font-size:14.5px;
    color:var(--brown);
    line-height:1.55;
    margin:0 auto;
    max-width:360px;
  }
  .status-line{
    text-align:center;
    font-size:13px;
    color:var(--brown);
    margin:22px 0 16px;
    min-height:18px;
    transition:opacity .3s;
  }
  .status-line.hidden{opacity:0;}

  .grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:14px;
  }
  .tile{
    position:relative;
    width:calc(33.333% - 10px);
    aspect-ratio:1 / 1;
    border-radius:50%;
    overflow:hidden;
    background:var(--paper);
    box-shadow:0 1px 0 rgba(123,45,62,0.06);
  }
  .tile .prize{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:16% 14%;
    gap:5px;
  }
  .tile .prize .big{
    font-family:'IBM Plex Mono', monospace;
    font-weight:500;
    font-size:18px;
    color:var(--wine);
    line-height:1;
  }
  .tile .prize .label{
    font-size:10.5px;
    color:var(--brown);
    line-height:1.25;
    max-width:80px;
  }
  .tile canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    touch-action:none;
    cursor:pointer;
  }
  .tile.locked canvas{
    cursor:default;
  }
  .tile.disabled{
    opacity:.35;
    filter:saturate(.4);
  }
  .tile.disabled canvas{
    pointer-events:none;
  }
  .tile.winner{
    box-shadow:0 0 0 2px var(--gold);
  }
  .hint{
    position:absolute;
    bottom:9px;
    left:0; right:0;
    text-align:center;
    font-size:10.5px;
    color:rgba(255,255,255,.88);
    letter-spacing:.01em;
    pointer-events:none;
  }

  .reveal-banner{
    margin-top:26px;
    border-top:1px solid rgba(123,45,62,0.18);
    padding-top:20px;
    text-align:center;
    opacity:0;
    transform:translateY(6px);
    transition:opacity .5s ease, transform .5s ease;
    min-height:1px;
  }
  .reveal-banner.show{
    opacity:1;
    transform:translateY(0);
  }
  .reveal-banner .you-got{
    font-size:12.5px;
    color:var(--brown);
    margin:0 0 6px;
  }
  .reveal-banner .prize-name{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:24px;
    color:var(--wine);
    margin:0;
  }

  .reset-row{
    margin-top:34px;
    text-align:center;
  }
  .reset-btn{
    font-family:'Public Sans', sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--brown);
    background:transparent;
    border:1px solid rgba(123,45,62,0.3);
    border-radius:999px;
    padding:10px 20px;
    cursor:pointer;
    transition:background .2s, color .2s;
  }
  .reset-btn:hover{
    background:var(--wine);
    color:var(--cream);
    border-color:var(--wine);
  }

  @media (prefers-reduced-motion: reduce){
    .reveal-banner{transition:none;}
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="masthead">
    <svg class="eyebrow-icon" viewBox="0 0 24 24" fill="none" stroke="#7B2D3E" stroke-width="1.3">
      <path d="M12 2C9 7 7 10 7 13.5C7 17.6 9.2 21 12 21C14.8 21 17 17.6 17 13.5C17 10 15 7 12 2Z"/>
    </svg>
    <h1>Your October surprise</h1>
    <p class="sub">Scratch one card to reveal today's perk. One scratch per visit.</p>
  </div>

  <p class="status-line" id="statusLine">Scratch any one card below</p>

  <div class="grid" id="grid"></div>

  <div class="reveal-banner" id="revealBanner">
    <p class="you-got">You got</p>
    <p class="prize-name" id="revealPrizeName">&nbsp;</p>
  </div>

  <div class="reset-row">
    <button class="reset-btn" id="resetBtn">Reset for next client</button>
  </div>

</div>

<script>
(function(){

  var PRIZES = [
    { big:"10%", label:"off total service price", name:"10% off your total" },
    { big:"12%", label:"off total service price", name:"12% off your total" },
    { big:"FREE", label:"add-on — cat eye, chrome, or gems (pick 1)", name:"a free add-on of your choice" },
    { big:"FREE", label:"mini cuticle oil", name:"a free mini cuticle oil" },
    { big:"+1", label:"stamp on your loyalty card", name:"an extra loyalty stamp" }
  ];

  var grid = document.getElementById('grid');
  var statusLine = document.getElementById('statusLine');
  var revealBanner = document.getElementById('revealBanner');
  var revealPrizeName = document.getElementById('revealPrizeName');
  var resetBtn = document.getElementById('resetBtn');

  var order = [];
  var revealed = false;

  function shuffledOrder(){
    var idx = [0,1,2,3,4];
    for (var i = idx.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = idx[i]; idx[i] = idx[j]; idx[j] = t;
    }
    return idx;
  }

  function buildTiles(){
    grid.innerHTML = '';
    order = shuffledOrder();
    revealed = false;
    revealBanner.classList.remove('show');
    revealPrizeName.textContent = '\u00A0';
    statusLine.textContent = 'Scratch any one card below';
    statusLine.classList.remove('hidden');

    order.forEach(function(prizeIndex, slotIndex){
      var prize = PRIZES[prizeIndex];

      var tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.slot = slotIndex;

      var prizeEl = document.createElement('div');
      prizeEl.className = 'prize';
      prizeEl.innerHTML =
        '<div class="big">' + prize.big + '</div>' +
        '<div class="label">' + prize.label + '</div>';
      tile.appendChild(prizeEl);

      var canvas = document.createElement('canvas');
      tile.appendChild(canvas);

      var hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = 'scratch';
      canvas.parentElement.style.position = 'relative';
      tile.appendChild(hint);

      grid.appendChild(tile);

      setupScratch(tile, canvas, hint, prize);
    });
  }

  function setupScratch(tile, canvas, hint, prize){
    var ctx = canvas.getContext('2d');
    var scratching = false;
    var cleared = 0;
    var totalPixels = 0;
    var checked = false;
    var pointerId = null;

    function resize(){
      var rect = tile.getBoundingClientRect();
      var dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawFoil(rect.width, rect.height);
      totalPixels = Math.round(rect.width * rect.height);
    }

    function drawFoil(w, h){
      ctx.clearRect(0, 0, w, h);
      var grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, '#D8B678');
      grad.addColorStop(0.5, '#C6A15B');
      grad.addColorStop(1, '#AE8A49');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 1;
      for (var i = -h; i < w; i += 9){
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i + h, h);
        ctx.stroke();
      }

      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#F4EFE7';
      ctx.beginPath();
      var cx = w/2, cy = h/2 - h*0.06, r = Math.min(w,h)*0.17;
      ctx.ellipse(cx, cy, r*0.55, r, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillRect(cx - r*0.18, cy + r*0.6, r*0.36, r*0.5);
      ctx.globalAlpha = 1;
    }

    resize();
    window.addEventListener('resize', resize);

    function pos(e){
      var rect = canvas.getBoundingClientRect();
      var x = (e.clientX !== undefined ? e.clientX : e.touches[0].clientX) - rect.left;
      var y = (e.clientY !== undefined ? e.clientY : e.touches[0].clientY) - rect.top;
      return {x:x, y:y};
    }

    function scratchAt(x, y){
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(x, y, 22, 0, Math.PI * 2);
      ctx.fill();
    }

    function checkCleared(){
      if (checked) return;
      var rect = tile.getBoundingClientRect();
      var dpr = window.devicePixelRatio || 1;
      var sampleW = Math.max(1, Math.round(rect.width / 4));
      var sampleH = Math.max(1, Math.round(rect.height / 4));
      var data;
      try{
        data = ctx.getImageData(0, 0, canvas.width, canvas.height, {willReadFrequently:true});
      }catch(e){ return; }
      var transparent = 0;
      var total = 0;
      var step = 4 * 6;
      for (var i = 3; i < data.data.length; i += step){
        total++;
        if (data.data[i] < 40) transparent++;
      }
      if (total > 0 && (transparent / total) > 0.55){
        checked = true;
        onCleared();
      }
    }

    function onCleared(){
      if (revealed) return;
      revealed = true;

      hint.style.display = 'none';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      canvas.style.transition = 'opacity .4s';
      canvas.style.opacity = '0';
      tile.classList.add('winner');

      var tiles = grid.querySelectorAll('.tile');
      tiles.forEach(function(t){
        if (t !== tile) t.classList.add('disabled');
      });

      statusLine.classList.add('hidden');
      revealPrizeName.textContent = prize.name;
      requestAnimationFrame(function(){
        revealBanner.classList.add('show');
      });
    }

    function start(e){
      if (revealed) return;
      scratching = true;
      var p = pos(e);
      scratchAt(p.x, p.y);
    }
    function move(e){
      if (!scratching || revealed) return;
      e.preventDefault();
      var p = pos(e);
      scratchAt(p.x, p.y);
      checkCleared();
    }
    function end(){
      scratching = false;
      checkCleared();
    }

    canvas.addEventListener('pointerdown', function(e){
      canvas.setPointerCapture(e.pointerId);
      start(e);
    });
    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
  }

  resetBtn.addEventListener('click', buildTiles);

  buildTiles();
})();
</script>

</body>
</html>
